stages:
  - build
  - cronjob

# This job builds the Docker image on every code commit.
docker-build-on-commit:
  # Use the official Docker image.
  image: docker:cli
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build --pull -t "$DOCKER_IMAGE_NAME" .
    - docker push "$DOCKER_IMAGE_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  # Run this job on every branch commit where a Dockerfile exists.
  rules:
    - if: '$CI_COMMIT_BRANCH'
      exists:
        - Dockerfile

# This is the new job specifically for your scheduled cronjob.
cronjob-task:
  # Use the official Docker image.
  image: docker:cli
  stage: cronjob
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - echo "Running the scheduled cronjob..."
    # Pull the latest Docker image
    - docker pull $CI_REGISTRY_IMAGE:latest
    # Run the Docker container
    - docker run $CI_REGISTRY_IMAGE:latest
  # This is the crucial rule. It runs only when a pipeline is triggered by a schedule.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
