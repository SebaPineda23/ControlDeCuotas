stages:
  - build
  - cronjob

# This job builds the Docker image on every code commit.
docker-build-on-commit:
  # Use the official Docker image.
  image: docker:cli
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - echo "Building and pushing the Docker image..."
    # Build and tag the image with the commit slug
    - docker build --pull -t "$DOCKER_IMAGE_NAME" .
    - docker push "$DOCKER_IMAGE_NAME"
    # Tag and push with `latest` to ensure the cronjob always finds it
    - docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  # Run this job on every branch commit where a Dockerfile exists.
  rules:
    - if: '$CI_COMMIT_BRANCH'
      exists:
        - Dockerfile

# This is the new job specifically for your scheduled cronjob.
cronjob-task:
  # Use the official Docker image.
  image: docker:cli
  stage: cronjob
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - echo "Running the scheduled cronjob..."
    # Pull the latest Docker image
    - docker pull "$CI_REGISTRY_IMAGE:latest"
    # Run the Docker container and pass the environment variables
    - docker run -e SPRING_MAIL_HOST="$SPRING_MAIL_HOST" -e SPRING_MAIL_PORT="$SPRING_MAIL_PORT" -e SPRING_MAIL_USERNAME="$SPRING_MAIL_USERNAME" -e SPRING_MAIL_PASSWORD="$SPRING_MAIL_PASSWORD" -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH="$SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH" -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE="$SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE" -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT="$SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT" "$CI_REGISTRY_IMAGE:latest"
  # This is the crucial rule. It runs only when a pipeline is triggered by a schedule.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'